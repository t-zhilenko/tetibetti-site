name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These are the same values from .env.local (gitignored) — all public
      # by design: social links and a client-side PostHog project token.
      # Everything the server actually needs (Brevo, Mono, etc.) already
      # lives as Cloudflare Worker secrets set once via `wrangler secret
      # put`, which persist across deploys — CI never touches them.
      - name: Build and deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_POSTHOG_TOKEN: phc_PrDa5MHf55qpgeu53yTQEXdz5irSyg8K0637jPXGXzn
          NEXT_PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          NEXT_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/tzhilenko/
          NEXT_PUBLIC_YOUTUBE_URL: https://www.youtube.com/@teti-betti
          NEXT_PUBLIC_PINTEREST_URL: https://pinterest.com/tetibettistudio/
          NEXT_PUBLIC_TELEGRAM_URL: https://t.me/teti_betti
          NEXT_PUBLIC_PATREON_URL: https://patreon.com/tetibetti
        run: |
          npx wrangler d1 migrations apply teti-betti-prod --remote
          npm run deploy:cf
